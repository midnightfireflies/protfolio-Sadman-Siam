<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#171717">
<title>{{ if .IsHome }}{{ site.Title }} | Cybersecurity, Networking & AI Automation{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
<meta name="author" content="{{ site.Params.author }}">
<meta name="keywords" content="{{ site.Params.keywords }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ if .IsHome }}{{ site.Title }} | Cybersecurity, Networking & AI Automation{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}">
<meta property="og:description" content="{{ site.Params.description }}">
<meta property="og:image" content="{{ "images/avatar.png" | absURL }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="{{ .Permalink }}">
<link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | relURL }}">
<script>
  (function () {
    try {
      var saved = localStorage.getItem('ss-theme');
      var preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = saved || preferred;
    } catch (e) {}
  })();
</script>
{{ $css := resources.Get "css/main.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
